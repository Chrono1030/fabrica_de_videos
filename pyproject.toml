[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fabrica-de-videos"
version = "0.1.0"
description = "Fábrica Python de videos educativos con renderizadores nativos intercambiables"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "Pillow>=10,<13", "openai>=1.60,<4", "num2words>=0.5.14,<0.6"]

[project.optional-dependencies]
piper = ["piper-tts==1.8.0"]
youtube = ["google-api-python-client==2.202.0"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
fabrica = "fabrica.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["native_renderer: real local Node/Chromium renderer integration (explicit opt-in)"]

# Mismas reglas que el workflow de CI, independientes del entorno de ejecución.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
fabrica = ["data/*.json", "renderers/assets/*", "renderers/*.json", "renderers/locks/*/*.json"]
